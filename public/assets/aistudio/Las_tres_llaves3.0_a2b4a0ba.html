<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Las tres llaves</title>
<style>
:root{--bg:#f1efe8;--panel:#fffdf6;--fg:#1d2420;--ac:#c2410c;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10150f;--panel:#1b221a;--fg:#e9efe2;--ac:#ffb020}}
:root[data-theme="dark"]{--bg:#10150f;--panel:#1b221a;--fg:#e9efe2;--ac:#ffb020}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(100vw,calc((100vh - 8px)*1.2));aspect-ratio:6/5}
canvas{width:100%;height:100%;display:block;background:#000;cursor:crosshair}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,8,.72)}
#pn{background:var(--panel);color:var(--fg);padding:28px 34px;max-width:78%;text-align:center;border:3px solid var(--ac);box-shadow:8px 8px 0 var(--ac)}
#pn h1{margin:0 0 10px;font-size:clamp(22px,4.4vw,44px);letter-spacing:.5px}
#pn p{margin:0 0 18px;line-height:1.5;font-size:clamp(13px,1.9vw,18px)}
#pn button{font:inherit;font-weight:bold;font-size:clamp(14px,2vw,20px);padding:10px 22px;margin:4px;background:var(--ac);color:#111;border:2px solid #111;cursor:pointer}
#pn button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
</style>
</head>

const say=(s,d=3)=>{txt=s;txtT=d};
// ---- Generación del mapa ----
function inObs(x,y,m){return obs.some(k=>x>k.x-m&&x<k.x+k.w+m&&y>k.y-m&&y<k.y+k.h+m)}
function genWorld(){
 const L=cur();mode='world';W=L.W;H=L.H;obs=[];haz=[];got=0;nTur=0;
 house={x:W/2-85,y:H/2-65,w:170,h:130};obs.push({x:house.x,y:house.y,w:170,h:130,t:3});
 const st={x:300,y:H-300},hc={x:W/2,y:H/2};keys=[];
 while(keys.length<3){const k={x:R(200,W-200),y:R(200,H-200),got:0};
  if(D(k,st)>L.kd&&D(k,hc)>500&&keys.every(o=>D(o,k)>1000))keys.push(k)}
 for(let i=0;i<L.nhaz;i++){const z={x:R(200,W-200),y:R(200,H-200),r:R(90,170)};
  if(D(z,st)>z.r+400&&D(z,hc)>z.r+300&&keys.every(k=>D(k,z)>z.r+90))haz.push(z)}
 for(let i=0;i<L.nobs;i++){const w=R(60,130),h=R(60,130),o={x:R(60,W-200),y:R(60,H-200),w,h,t:i%3},c={x:o.x+w/2,y:o.y+h/2};
  if(D(c,st)>260&&D(c,hc)>330&&keys.every(k=>D(c,k)>170))obs.push(o)}
 // --- Arma especial: la escopeta de dispersión (solo si aún no la tienes) ---
 pickups=[];
 if(!P||!P.weapons||!P.weapons.includes('shotgun')){
  for(let i=0;i<400;i++){
   const q={x:R(300,W-300),y:R(300,H-300)};
   if(D(q,st)>950&&D(q,hc)>420&&!inObs(q.x,q.y,45)&&!haz.some(z=>D(z,q)<z.r+70)&&keys.every(k=>D(k,q)>220)){
    pickups.push({x:q.x,y:q.y,type:'shotgun'});break}}}
 // --- Jugador (conserva armas entre fases) ---
 const pw=P&&P.weapons?P.weapons.slice():['pistol'],pi=P&&P.wep!==undefined?P.wep:0;
 P={x:st.x,y:st.y,r:16,hp:P?P.hp:CFG.pHp,cd:0,inv:0,ang:0,weapons:pw,wep:Math.min(pi,pw.length-1)};
 bullets=[];ebul=[];en=[];drops=[];parts=[];boss=null;cam.x=P.x-VW/2;cam.y=P.y-VH/2;bombs=[];blasts=[];fillBombs();
 for(let i=0;i<L.tur*4&&nTur<L.tur;i++){const q={x:R(200,W-200),y:R(200,H-200)};
  if(D(q,st)>700&&D(q,hc)>250&&!inObs(q.x,q.y,40)&&!haz.some(z=>D(z,q)<z.r+30)){spawnEn('turret',q.x,q.y);nTur++}}
}
function newGame(lv,keep){level=lv;if(!keep)nBombs=0;t=0;spawnT=2;const hp=keep&&P?Math.min(CFG.pHp,P.hp+40):CFG.pHp;
 P=keep&&P?{hp,weapons:P.weapons.slice(),wep:P.wep}:null;genWorld();P.hp=hp;S='play';ov(0);say(cur().tip,5)}
function enterArena(){
 SFX.enter();mode='arena';W=1200;H=1000;fade=1;
 obs=[[300,300],[800,300],[300,650],[800,650]].map(p=>({x:p[0],y:p[1],w:100,h:100,t:0}));
 en=[];ebul=[];bullets=[];drops=[];pickups=[];haz=cur().nhaz?[{x:210,y:790,r:75},{x:990,y:790,r:75},{x:600,y:520,r:60}]:[];P.x=600;P.y=900;cam.x=0;cam.y=0;bombs=[];blasts=[];fillBombs();
 const mx=CFG.bossHp*(1+.3*(level-1));
 boss={kind:Math.min(level,3),x:600,y:200,r:[54,46,72][Math.min(level,3)-1],hp:mx,max:mx,t:0,p2:0,state:'idle',a1:2,a2:3,a3:6,a4:4,wT:0,dT:0,vx:0,vy:0,dead:0};
 say('¡El guardián despierta! No hay salida.',3);
}
// ---- Colisiones ----
function push(o,r){for(const k of obs){const cx=Math.max(k.x,Math.min(o.x,k.x+k.w)),cy=Math.max(k.y,Math.min(o.y,k.y+k.h)),dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);
 if(d<r){if(d>0){o.x+=dx/d*(r-d);o.y+=dy/d*(r-d)}else o.x+=r}}
 o.x=Math.max(r,Math.min(W-r,o.x));o.y=Math.max(r,Math.min(H-r,o.y))}
const hitObs=b=>obs.some(k=>b.x>k.x&&b.x<k.x+k.w&&b.y>k.y&&b.y<k.y+k.h)||b.x<0||b.y<0||b.x>W||b.y>H;
function burst(x,y,col,n=8){for(let i=0;i<n;i++){const a=R(0,6.28),s=R(60,240);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.3,.7),c:col})}}
function hurt(d){if(P.inv>0||S!=='play')return;P.hp-=d;P.inv=CFG.inv;shake=10;flash=.35;SFX.hurt();
 if(P.hp<=0)die()}
function die(){if(1){P.hp=0;S='over';SFX.bossDie();show('Has caído','El mapa sigue ahí. Inténtalo de nuevo.',[['Reintentar',()=>newGame(level,0)]])}}
// ---- Armas del jugador ----
function fire(){
 const w=WEAPONS[P.weapons[P.wep]]||WEAPONS.pistol;
 P.cd=w.fire;
 for(let i=0;i<w.n;i++){
  // Dos postas separadas 20° (una a -10° y otra a +10° respecto a la mira)
  const a=P.ang+(w.n>1?(i-(w.n-1)/2)*w.spread:0);
  bullets.push({x:P.x+Math.cos(a)*22,y:P.y+Math.sin(a)*22,vx:Math.cos(a)*w.spd,vy:Math.sin(a)*w.spd,l:w.life,dmg:w.dmg,c:w.color,r:w.r});
 }
 w.sfx();
}
function addWeapon(type){
 if(!P.weapons.includes(type))P.weapons.push(type);
 P.wep=P.weapons.indexOf(type);
 SFX.pick();burst(P.x,P.y,'#ffb020',22);
 say('¡'+WEAPONS[type].name+' de dispersión! Pulsa Q (o 1/2) para cambiar de arma',4.5);
}
function cycleWeapon(){if(S!=='play'||!P||!P.weapons||P.weapons.length<2)return;
 P.wep=(P.wep+1)%P.weapons.length;P.cd=Math.max(P.cd,.15);announceWeapon()}
function pickWeapon(i){if(S!=='play'||!P||!P.weapons||i>=P.weapons.length||i===P.wep)return;
 P.wep=i;P.cd=Math.max(P.cd,.15);announceWeapon()}
function announceWeapon(){say('Arma: '+WEAPONS[P.weapons[P.wep]].name,1.2);snd(560,.08,'square',.05,140)}
// ---- Enemigos ----
function spawnEn(type,x,y){const c=CFG[type],sc=1+.12*(level-1)+.12*got;
 en.push({type,x,y,r:c.r,hp:c.hp*sc,max:c.hp*sc,cd:R(.5,1.5),dir:Math.random()<.5?1:-1})}
function trySpawn(dt){const L=cur(),cap=Math.min(26,L.cap+got*3)+nTur;spawnT-=dt;if(spawnT>0||en.length>=cap)return;
 spawnT=Math.max(.5,L.sp-got*.3-t/300);
 const a=R(0,6.28),x=P.x+Math.cos(a)*820,y=P.y+Math.sin(a)*820;
 if(x<40||y<40||x>W-40||y>H-40||inObs(x,y,30))return;
 let r=Math.random()*L.mix.reduce((u,m)=>u+m[1],0),ty=L.mix[0][0];for(const m of L.mix){if((r-=m[1])<=0){ty=m[0];break}}
 if(ty==='bat')for(let i=0;i<3;i++)spawnEn('bat',x+R(-40,40),y+R(-40,40));else spawnEn(ty,x,y)}
function killEn(e){SFX.kill();burst(e.x,e.y,e.type==='chaser'?'#ff5a4d':'#c56bff',12);if(Math.random()<CFG.dropHeal)drops.push({x:e.x,y:e.y})}
function eShoot(x,y,a,s,d){ebul.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,dmg:d,l:3})}
// ---- Jefe ----
// Espectro (fase 2): se teletransporta y dispara abanicos
function k2(b,dt,ang,p2){if((b.a4-=dt)<=0){b.a4=p2?2.2:3.2;const a=R(0,6.28);b.x=Math.max(80,Math.min(1120,P.x+Math.cos(a)*300));b.y=Math.max(80,Math.min(920,P.y+Math.sin(a)*300));burst(b.x,b.y,'#9be7ff',16);snd(500,.3,'sine',.08,-300);
  const q=Math.atan2(P.y-b.y,P.x-b.x);for(let i=-2;i<=2;i++)eShoot(b.x,b.y,q+i*.2,420,10)}
 if((b.a2-=dt)<=0){b.a2=p2?1.8:3;for(let i=0;i<14;i++)eShoot(b.x,b.y,i/14*6.28+b.t,230,8)}
 if(p2&&(b.a3-=dt)<=0){b.a3=5;if(en.length<7)for(let i=0;i<3;i++)spawnEn('bat',b.x+R(-60,60),b.y+R(-60,60))}}
// Coloso (fase 3): lento, espirales de balas y brutos
function k3(b,dt,ang,p2){b.x+=Math.cos(ang)*40*dt;b.y+=Math.sin(ang)*40*dt;
 if((b.a1-=dt)<=0){b.a1=p2?.12:.18;b.sp=(b.sp||0)+.35;eShoot(b.x,b.y,b.sp,300,7);eShoot(b.x,b.y,b.sp+3.14,300,7);if(p2){eShoot(b.x,b.y,b.sp+1.57,300,7);eShoot(b.x,b.y,b.sp-1.57,300,7)}}
 if((b.a3-=dt)<=0){b.a3=7;if(p2&&en.length<4)spawnEn('brute',b.x,b.y+90)}
 if((b.a2-=dt)<=0){b.a2=4;for(let i=-3;i<=3;i++)eShoot(b.x,b.y,ang+i*.18,420,12)}}
function bossUpdate(dt){const b=boss;b.t+=dt;
 if(!b.p2&&b.hp<b.max/2){b.p2=1;say('¡El jefe se enfurece! Fase 2',2.5);snd(90,.6,'sawtooth',.12,200);shake=20}
 const p2=b.p2,ang=Math.atan2(P.y-b.y,P.x-b.x);
 if(b.kind===2)k2(b,dt,ang,p2);else if(b.kind===3)k3(b,dt,ang,p2);else if(b.state==='idle'){b.x+=(600+Math.sin(b.t*.8)*380-b.x)*dt*2;b.y+=(230+Math.sin(b.t*1.3)*70-b.y)*dt*2;
  if((b.a1-=dt)<=0){b.a1=p2?.9:1.4;for(let i=-1;i<=1;i++)eShoot(b.x,b.y,ang+i*.26,380,10);snd(250,.12,'square',.05,-100)}
  if((b.a2-=dt)<=0){b.a2=p2?2.2:3.6;const n=p2?18:12;for(let i=0;i<n;i++)eShoot(b.x,b.y,i/n*6.28+b.t,260,8);snd(200,.3,'sawtooth',.06,-80)}
  if(p2){if((b.a3-=dt)<=0){b.a3=6;if(en.length<5){spawnEn('chaser',b.x-60,b.y+40);spawnEn('chaser',b.x+60,b.y+40)}}
   if((b.a4-=dt)<=0){b.state='wind';b.wT=.6;b.vx=Math.cos(ang)*680;b.vy=Math.sin(ang)*680}}}
 else if(b.state==='wind'){if((b.wT-=dt)<=0){b.state='dash';b.dT=.7;snd(120,.5,'sawtooth',.1,100)}}
 else{b.x+=b.vx*dt;b.y+=b.vy*dt;b.x=Math.max(70,Math.min(1130,b.x));b.y=Math.max(70,Math.min(930,b.y));if((b.dT-=dt)<=0){b.state='idle';b.a4=4}}
 if(D(b,P)<b.r+P.r)hurt(CFG.bossContact);
 if(b.hp<=0){b.dead=1;burst(b.x,b.y,'#ffd23f',70);burst(b.x,b.y,'#ff5a4d',50);SFX.bossDie();en=[];ebul=[];winT=1.8;shake=30;say('¡Jefe derrotado!',3);boss=null}}
// ---- Actualización ----
function update(dt){
 t+=dt;
 // jugador
 const mx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),my=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0),m=Math.hypot(mx,my)||1;
 if(winT<=0){P.x+=mx/m*CFG.pSpeed*cur().spd*dt;P.y+=my/m*CFG.pSpeed*cur().spd*dt;push(P,P.r)}
 P.ang=Math.atan2(mouse.y+cam.y-P.y,mouse.x+cam.x-P.x);P.cd-=dt;P.inv-=dt;
 if((down||K[' '])&&P.cd<=0&&winT<=0)fire();

 for(const z of haz)if(D(z,P)<z.r&&winT<=0){P.hp-=16*dt;flash=Math.max(flash,.12);if(Math.random()<dt*6)snd(110,.08,'sawtooth',.03)}
 if(P.hp<=0&&S==='play')die();
 if(cur().embers&&Math.random()<dt*25)parts.push({x:cam.x+R(0,VW),y:cam.y+VH,vx:R(-20,20),vy:-R(60,140),l:R(1,2),c:'#ff9a3d'});
 // balas del jugador
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(hitObs(b)){b.l=0;burst(b.x,b.y,'#ddd',3);continue}
  for(const e of en)if(e.hp>0&&D(b,e)<e.r+5){e.hp-=(b.dmg||CFG.pDmg);b.l=0;burst(b.x,b.y,'#fff',4);if(e.hp<=0)killEn(e);break}
  if(boss&&b.l>0&&D(b,boss)<boss.r+5){boss.hp-=(b.dmg||CFG.pDmg)*.6;b.l=0;burst(b.x,b.y,'#ffd23f',4)}}
 bullets=bullets.filter(b=>b.l>0);
 // enemigos
 for(const e of en){const c=CFG[e.type],a=Math.atan2(P.y-e.y,P.x-e.x),d=D(e,P);let vx=0,vy=0;
  if(e.type==='turret'){if((e.cd-=dt)<=0&&d<680){e.cd=c.fire;for(let i=-1;i<=1;i++)eShoot(e.x,e.y,a+i*.3,c.bspd,c.dmg);snd(220,.1,'square',.04,-80)}}
  else if(e.type!=='shooter'){const w=e.type==='bat'?Math.sin(t*6+e.cd*9)*130:0;vx=Math.cos(a)*c.spd+Math.cos(a+1.57)*w;vy=Math.sin(a)*c.spd+Math.sin(a+1.57)*w;if(d<e.r+P.r)hurt(c.dmg)}
  else{const s=d>420?1:d<280?-1:0;vx=Math.cos(a)*c.spd*s+Math.cos(a+1.57)*c.spd*.6*e.dir*(s?0:1);vy=Math.sin(a)*c.spd*s+Math.sin(a+1.57)*c.spd*.6*e.dir*(s?0:1);
   if((e.cd-=dt)<=0&&d<700){e.cd=c.fire;eShoot(e.x,e.y,a,c.bspd,c.dmg)}}
  e.x+=vx*dt;e.y+=vy*dt;push(e,e.r)}
 en=en.filter(e=>e.hp>0);
 // balas enemigas
 for(const b of ebul){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(hitObs(b))b.l=0;else if(D(b,P)<P.r+5){b.l=0;hurt(b.dmg)}}
 ebul=ebul.filter(b=>b.l>0);
 // curas
 drops=drops.filter(d=>{if(D(d,P)<30){P.hp=Math.min(CFG.pHp,P.hp+CFG.healAmt);SFX.heal();say('+'+CFG.healAmt+' de vida',1.2);return false}return true});

 bombs=bombs.filter(b=>{if(D(b,P)<BOMB.pick){nBombs++;SFX.heal();say('Bomba recogida ('+nBombs+'). Pulsa R para detonarla',2.5);return false}return true});fillBombs();
 for(const b of blasts)b.l-=dt;blasts=blasts.filter(b=>b.l>0);
 if(mode==='world'){trySpawn(dt);
  // recoger armas
  pickups=pickups.filter(p=>{if(D(p,P)<36){addWeapon(p.type);return false}return true});
  for(const k of keys)if(!k.got&&D(k,P)<32){k.got=1;got++;SFX.key();say(got<3?'Llave '+got+'/3 recogida':'¡Tienes las 3 llaves! Ve a la casa y pulsa E',3.5)}}
 else if(boss)bossUpdate(dt);
 if(winT>0&&(winT-=dt)<=0){S='win';if(level>=3)show('¡Juego completado!','Has derrotado a los tres jefes y superado las tres fases. Gracias por jugar.',[['Jugar de nuevo',()=>newGame(1,0)]]);else show(cur().name+' superada','Has derrotado al jefe. La siguiente fase es totalmente distinta.',[['Siguiente nivel',()=>newGame(level+1,1)],['Reiniciar',()=>newGame(1,0)]])}
 // partículas, cámara, textos
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
 txtT-=dt;shake=Math.max(0,shake-dt*40);flash=Math.max(0,flash-dt);fade=Math.max(0,fade-dt);
 const tx=Math.max(0,Math.min(W-VW,P.x-VW/2)),ty=Math.max(0,Math.min(H-VH,P.y-VH/2)),f=Math.min(1,dt*8);cam.x+=(tx-cam.x)*f;cam.y+=(ty-cam.y)*f}
function interact(){if(S!=='play'||mode!=='world')return;const c={x:house.x+house.w/2,y:house.y+house.h/2};
 if(D(P,c)>190)return;if(got<3){say('Necesitas 3 llaves ('+got+'/3)',2.5);snd(120,.2,'square',.08)}else enterArena()}
// ---- Dibujo ----
function draw(){
 X.save();X.fillStyle='#000';X.fillRect(0,0,VW,VH);
 if(!P){X.restore();return}
 const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;X.translate(-Math.round(cam.x)+sx,-Math.round(cam.y)+sy);
 if(mode==='world'){const Z=cur().zones;
  for(let i=0;i<4;i++){X.fillStyle=Z[i];X.fillRect(i%2*W/2,(i>>1)*H/2,W/2,H/2)}
  X.fillStyle='rgba(255,255,255,.07)';for(let x=Math.floor(cam.x/100)*100;x<cam.x+VW+100;x+=100)for(let y=Math.floor(cam.y/100)*100;y<cam.y+VH+100;y+=100)X.fillRect(x,y,4,4)}
 else{for(let x=0;x<12;x++)for(let y=0;y<10;y++){X.fillStyle=(x+y)%2?cur().ar[0]:cur().ar[1];X.fillRect(x*100,y*100,100,100)}
  X.strokeStyle=cur().ar[2];X.lineWidth=6;X.strokeRect(3,3,W-6,H-6)}

 for(const z of haz){const g=X.createRadialGradient(z.x,z.y,z.r*.2,z.x,z.y,z.r);g.addColorStop(0,'#ffe36b');g.addColorStop(.6,'#ff7a1a');g.addColorStop(1,'#b3210d');X.fillStyle=g;X.globalAlpha=.85+Math.sin(t*3+z.x)*.1;X.beginPath();X.arc(z.x,z.y,z.r,0,6.28);X.fill();X.globalAlpha=1}
 // obstáculos
 for(const k of obs){if(k.x>cam.x+VW||k.y>cam.y+VH||k.x+k.w<cam.x||k.y+k.h<cam.y)continue;
  if(k.t===0){X.fillStyle=cur().pal.r[0];X.fillRect(k.x,k.y,k.w,k.h);X.fillStyle=cur().pal.r[1];X.fillRect(k.x,k.y,k.w,8);X.fillRect(k.x,k.y,8,k.h)}
  else if(k.t===1){X.fillStyle=cur().pal.c[0];X.fillRect(k.x,k.y,k.w,k.h);X.strokeStyle=cur().pal.c[1];X.lineWidth=5;X.strokeRect(k.x+3,k.y+3,k.w-6,k.h-6);X.beginPath();X.moveTo(k.x,k.y);X.lineTo(k.x+k.w,k.y+k.h);X.moveTo(k.x+k.w,k.y);X.lineTo(k.x,k.y+k.h);X.stroke()}
  else if(k.t===2){X.fillStyle=cur().pal.c[1];X.fillRect(k.x+k.w/2-8,k.y+k.h/2,16,k.h/2);X.fillStyle=cur().pal.t[0];X.beginPath();X.arc(k.x+k.w/2,k.y+k.h/2,Math.min(k.w,k.h)/2+4,0,6.28);X.fill();X.fillStyle=cur().pal.t[1];X.beginPath();X.arc(k.x+k.w/2-8,k.y+k.h/2-8,Math.min(k.w,k.h)/4,0,6.28);X.fill()}}
 if(mode==='world'){ // casa
  const h=house,ok=got>=3;X.fillStyle=cur().pal.wall;X.fillRect(h.x,h.y,h.w,h.h);X.fillStyle=cur().pal.roof;X.beginPath();X.moveTo(h.x-14,h.y+34);X.lineTo(h.x+h.w/2,h.y-40);X.lineTo(h.x+h.w+14,h.y+34);X.fill();
  X.fillStyle=ok?'#3ddc84':'#d63a2f';X.fillRect(h.x+h.w/2-18,h.y+h.h-60,36,60);X.fillStyle='#111';X.font='bold 16px monospace';X.textAlign='center';X.fillText(ok?'ABIERTA':'CERRADA',h.x+h.w/2,h.y+h.h+22);
  for(const k of keys)if(!k.got){const y=k.y+Math.sin(t*4)*5;X.fillStyle='rgba(255,210,63,.25)';X.beginPath();X.arc(k.x,y,30,0,6.28);X.fill();X.strokeStyle='#ffd23f';X.fillStyle='#ffd23f';X.lineWidth=5;X.beginPath();X.arc(k.x-8,y,9,0,6.28);X.stroke();X.fillRect(k.x,y-2.5,22,5);X.fillRect(k.x+14,y,4,9);X.fillRect(k.x+20,y,4,6)}}
 // armas en el suelo
 for(const p of pickups){const yy=p.y+Math.sin(t*3)*4;

const OV=document.getElementById('ov'),PN=document.getElementById('pn');
function ov(v){OV.style.display=v?'flex':'none'}

// ---- Entrada ----
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();K[k]=1;
 if(k==='e'&&!e.repeat)interact();
 if(k==='q'&&!e.repeat)cycleWeapon();
 if(k==='r'&&!e.repeat)explode();

addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
addEventListener('blur',()=>{K={};down=false});
C.addEventListener('mousemove',e=>{const r=C.getBoundingClientRect();mouse.x=(e.clientX-r.left)*VW/r.width;mouse.y=(e.clientY-r.top)*VH/r.height});
C.addEventListener('mousedown',e=>{if(e.button===0)down=true});addEventListener('mouseup',()=>down=false);
C.addEventListener('contextmenu',e=>e.preventDefault());

// ---- Bucle principal con delta time ----
let last=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(S==='play'||S==='win')if(S==='play')update(dt);draw();requestAnimationFrame(loop)}
newGame(1,0);S='menu';
show('Las tres llaves','Tres fases muy distintas: bosque, cripta oscura y fortaleza de lava. En cada una encuentra 3 llaves, abre la casa y derrota al jefe. Busca la ESCOPETA DE DISPERSIÓN en el mapa: dispara dos postas separadas 20°, con la misma potencia y cadencia que la pistola. WASD o flechas: moverse · ratón: apuntar · clic o espacio: disparar · Q o 1/2: cambiar de arma · rueda del ratón: cambiar de arma · E: interactuar · Q: cambiar de arma · R: bomba.',[['Jugar',()=>newGame(1,0)]]);
requestAnimationFrame(loop);
